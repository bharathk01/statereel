# Publishes the single-file viewer to GitHub Pages, so it is usable from a URL.
# Repo setting needed once: Settings > Pages > Source = GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refuse to deploy a broken parser
        run: bash tests/run-all.sh --no-e2e

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp statereel.html _site/index.html
          cp statereel.html _site/statereel.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
